[project]
name = "myagent"
version = "0.1.0"
description = "轻量级多渠道 AI Agent 框架（CLI + 飞书），含双层记忆与工具调用"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.30.0",
    "aioconsole>=0.7.0",
    "lark-oapi>=1.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[tool.uv]
# uv 默认会读取 pyproject.toml 的 dependencies 来同步环境
# 之后可用 `uv sync` 一键安装/复现
